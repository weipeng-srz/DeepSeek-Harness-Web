<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="DSH Chat · 只读分享" />
    <meta property="og:description" content="由 DSH Chat 生成的只读对话快照" />
    <meta property="og:type" content="article" />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:site_name" content="DSH Chat" />
    <title>只读分享 · DSH Chat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/share.css" />
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <script defer src="/js/markdown.js?v=33"></script>
    <script defer src="/vendor/katex/katex.min.js"></script>
    <script defer src="/vendor/katex/contrib/auto-render.min.js"></script>
    <script defer src="/js/share.js?v=4"></script>
  </head>
  <body>
    <header class="share-top">
      <a class="share-brand" href="/" aria-label="DSH Chat 首页">
        <span class="share-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img" aria-hidden="true">
            <path
              d="M9.2 11.6c1.7-2.5 4.4-3.6 7.2-3.1 2.3.4 4.1 1.9 5.1 3.9.8 1.6 2 2.6 3.8 2.9l-1.5 2.1c-1.1 1.5-2.7 2.4-4.5 2.7-2.7.4-5.2-.7-6.8-2.8-1-1.4-2.4-2.2-4.2-2.4l.9-3.3Z"
              fill="currentColor"
              stroke="none"
            />
          </svg>
        </span>
        <span>DSH Chat</span>
      </a>
      <div class="share-actions">
        <button id="shareCopy" class="share-btn" type="button">复制链接</button>
        <button id="sharePrint" class="share-btn" type="button">打印 / PDF</button>
      </div>
    </header>

    <main id="shareMain" class="share-main">
      <div class="share-loading" role="status">正在载入分享内容…</div>
    </main>

    <footer class="share-foot">
      <span>只读分享 · 由 DSH Chat 生成</span>
      <span id="shareExpiry" class="share-expiry"></span>
    </footer>

    <div id="shareToast" class="share-toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
